name: Deploy

# One production deployment of one Vercel project. Called by pipeline.yml
# once for the backend and once for the frontend: they are separate Vercel
# projects on separate hosts, configured by environment variables in each.
on:
  workflow_call:
    inputs:
      target:
        description: frontend or backend (the directory, and the smoke test to run)
        type: string
        required: true
      project-id:
        description: The Vercel project ID for this target
        type: string
        required: true
    outputs:
      url:
        description: The deployment URL
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@60.1.3
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ inputs.project-id }}

jobs:
  deploy:
    name: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Uploads only this target's directory, so its vercel.json and
      # .vercelignore apply. The project's Root Directory must be left empty.
      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --cwd "$TARGET" --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TARGET: ${{ inputs.target }}
          URL: ${{ steps.deploy.outputs.url }}
        run: .github/scripts/smoke.sh "$TARGET" "$URL"
