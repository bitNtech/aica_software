
name: CI/CD

# Pull requests run CI only.
# Pushes to main run CI, then production backend and frontend.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  production-backend:
    name: Production (backend)
    needs: ci
    if: >-
      vars.VERCEL_BACKEND_PROJECT_ID != '' &&
      vars.VERCEL_FRONTEND_PROJECT_ID != '' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    with:
      target: backend
      project-id: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
      environment: production
    secrets: inherit

  production-frontend:
    name: Production (frontend)
    needs: production-backend
    uses: ./.github/workflows/deploy.yml
    with:
      target: frontend
      project-id: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
      environment: production
    secrets: inherit
