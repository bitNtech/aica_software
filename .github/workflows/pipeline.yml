name: CI/CD

# Pull requests: CI only. The `main` ruleset requires these checks to pass
# before a PR can merge, and merging is the approval.
# main: CI again on the merged code, then production: backend first (with a
# smoke test), then frontend. If CI fails, nothing deploys. See docs/cicd.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  # Supersede stale PR runs; never interrupt a production deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Skips until both Vercel project IDs are set as repository variables.
  production-backend:
    name: Production (backend)
    needs: ci
    if: >-
      vars.VERCEL_BACKEND_PROJECT_ID != '' &&
      vars.VERCEL_FRONTEND_PROJECT_ID != '' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    with:
      target: backend
      project-id: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
    secrets: inherit

  # The frontend never ships ahead of the API it depends on.
  production-frontend:
    name: Production (frontend)
    needs: production-backend
    uses: ./.github/workflows/deploy.yml
    with:
      target: frontend
      project-id: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
    secrets: inherit
